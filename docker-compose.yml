services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fairdatahive
      POSTGRES_USER: fairdatahive
      POSTGRES_PASSWORD: fairdatahive
    ports:
      # Host 5434 avoids conflict with local Postgres (5432) or old stacks on 5433
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdatahive -d fairdatahive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-18T19-09-19Z
    command: server --console-address ":9001" /data
    ports:
      # Host 9002/9003 avoids conflict with another MinIO on 9000/9001
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  redis:
    image: redis:7-alpine
    # No host port — API reaches redis://redis:6379 on the compose network only
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    profiles:
      - auth

  api:
    build: .
    ports:
      # Host 8002 avoids conflict with other apps on 8000/8001 (e.g. old datalens stack)
      - "8002:8000"
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgresql+asyncpg://fairdatahive:fairdatahive@postgres:5432/fairdatahive
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    entrypoint: ["/app/docker/entrypoint.sh"]
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    restart: unless-stopped

  # UI: use `cd frontend && npm run dev` (http://127.0.0.1:5173) or build + http://localhost:8002/ui/
  # Do not add a Docker Vite service — it duplicated port 5173 and caused a second server on 5174.

volumes:
  postgres-data:
  minio-data:
  redis-data:
