services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fairdatahive
      POSTGRES_USER: fairdatahive
      POSTGRES_PASSWORD: fairdatahive
    ports:
      # Host 5434 avoids conflict with local Postgres (5432) or old stacks on 5433
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdatahive -d fairdatahive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs:
    # Object storage (S3 API). Pinned to an immutable digest; bump deliberately and
    # re-run `pytest tests/test_storage_integration.py` against the new build.
    # Override with RUSTFS_IMAGE=... in .env if you must test another release.
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c}
    command: ["/data"]
    environment:
      # Server ROOT credentials. Local default only; the API should use a
      # restricted key in production (see SECURITY.md).
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-error}
    ports:
      # Host 9002/9003 (same as the previous MinIO mapping) so S3_PUBLIC_ENDPOINT
      # keeps working. Bound to loopback: the console must not be internet-facing.
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      # New volume on purpose: never point RustFS at the old minio-data volume.
      - rustfs-data:/data
    healthcheck:
      # curl is present in the pinned image; /health is the documented S3 probe.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port — API reaches redis://redis:6379 on the compose network only
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    profiles:
      - auth

  api:
    build: .
    ports:
      # Host 8002 avoids conflict with other apps on 8000/8001 (e.g. old datalens stack)
      - "8002:8000"
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgresql+asyncpg://fairdatahive:fairdatahive@postgres:5432/fairdatahive
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/app/docker/entrypoint.sh"]
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    restart: unless-stopped

  # UI: use `cd frontend && npm run dev` (http://127.0.0.1:5173) or build + http://localhost:8002/ui/
  # Do not add a Docker Vite service — it duplicated port 5173 and caused a second server on 5174.

volumes:
  postgres-data:
  rustfs-data:
  # Retained (not mounted) so existing MinIO data survives for migration/rollback.
  # Remove only after the rollback window in docs/storage-migration.md has passed.
  minio-data:
  redis-data:
