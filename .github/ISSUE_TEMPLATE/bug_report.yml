name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include steps to reproduce and your environment (Docker vs local, branch/commit).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. Open http://localhost:5173
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: main @ abc1234, or image tag
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - API / backend
        - Web UI
        - Search
        - Upload / MinIO
        - Auth / access control
        - Docker / deployment
        - Documentation
        - Other
